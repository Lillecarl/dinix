# One job that builds `checks`, which is every collection in every mode and
# both container tests. See dev.nix.
#
# One job and not one per test, because there is no binary cache: the guest
# system and the UML kernel are built here, and a second job would build them
# again rather than share them. Add a cache and splitting becomes worth it.
name: ci

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  # modular.nix tracks a NixOS interface the manual still calls unstable, and
  # the runner feeds dev.nix unpinned nixpkgs-unstable. Without a schedule
  # only a push answers whether upstream moved, so a quiet week answers
  # nothing. Off the hour, because GitHub delays a cron that starts on one.
  # A schedule stops running after 60 days with no repository activity.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    # A cold runner builds the UML kernel, the guest system and every service
    # closure before the first guest boots. GitHub's own ceiling is 6 hours.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@main
        timeout-minutes: 10

      # The images and closures under test do not fit beside the runner's
      # preinstalled toolchains.
      - name: Make room on the runner
        timeout-minutes: 10
        run: |
          df -h /
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift \
            /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android \
            /opt/az /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/google /usr/lib/firefox
          docker system prune --all --force
          df -h /

      - uses: cachix/install-nix-action@master
        timeout-minutes: 15
        with:
          # dev.nix takes `pkgs ? import <nixpkgs> { }`, so a runner decides
          # which nixpkgs the tests run against. Unstable, unpinned: a run
          # therefore also answers whether dinix still builds against a moving
          # nixpkgs, and the cost is that a red run may mean only that nixpkgs
          # moved. See issue #17 for putting a pin in the repository, where a
          # local build would read it too.
          nix_path: nixpkgs=channel:nixpkgs-unstable
          # A runner has four cores and a guest is a process, so running
          # several builds at once only makes each one slower.
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            max-jobs = 1

      # A UML guest boots inside the Nix sandbox, which unshares a user
      # namespace, and Ubuntu's AppArmor denies an unprivileged one. Without
      # this every test fails at startup rather than on its own merits. The
      # unshare is the proof it took, not a formality.
      - name: Allow an unprivileged user namespace
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      # Evaluation alone answers in about a minute what a typo in a collection
      # would otherwise cost the whole build to find: the kernel and the guest
      # system come first, and they are hours on a cold runner.
      - name: Evaluate every check
        timeout-minutes: 20
        run: nix eval --raw --file ./dev.nix checks.drvPath

      # --keep-going: one failing collection should not hide the state of the
      # other six. A test output is an empty file whose existence means it ran
      # and behaved.
      - name: Build every check
        timeout-minutes: 330
        run: nix build --no-link --print-build-logs --keep-going --file ./dev.nix checks
