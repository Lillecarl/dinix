[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dinit-client"
version = "0.1.0"
description = "AnyIO client for the dinit control socket protocol"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anyio>=4.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/dinit_client"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
anyio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "Use anyio instead"
